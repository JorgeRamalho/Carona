<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>
    (function () {
      if (location.protocol !== 'file:') return;
      var target = 'http://localhost:3000/trajeto.html' + (location.search || '') + (location.hash || '');
      location.replace(target);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Trajeto até o passageiro — Carona</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/accessibility.css">
  <link rel="stylesheet" href="/css/dashboard.css?v=8">
</head>
<body class="nav-page">
  <div class="nav-window">
    <div id="navMap" class="nav-map" role="img" aria-label="Trajeto do motorista até o passageiro"></div>

    <header class="nav-top">
      <div class="visor-chip" id="navClock">--:--</div>
      <div class="visor-chip visor-chip-status is-online" id="navPhase">A caminho</div>
      <div class="visor-chip visor-chip-earn" id="navEta">Calculando rota</div>
    </header>

    <div class="speedo speedo-nav" id="visorSpeedWrap" aria-live="polite">
      <svg class="speedo-dial" viewBox="0 0 220 148" role="img" aria-label="Velocímetro">
        <path class="speedo-track" d="M30 118 A80 80 0 0 1 190 118" fill="none"/>
        <path class="speedo-arc" d="M30 118 A80 80 0 0 1 190 118" fill="none"/>
        <text class="speedo-tick-label" x="22" y="136">0</text>
        <text class="speedo-tick-label" x="58" y="56">60</text>
        <text class="speedo-tick-label" x="100" y="30">90</text>
        <text class="speedo-tick-label" x="148" y="56">120</text>
        <text class="speedo-tick-label" x="188" y="136">180</text>
        <g id="speedoNeedle" transform="rotate(-90 110 118)">
          <polygon points="110,42 105,118 115,118"/>
          <circle cx="110" cy="118" r="8"/>
        </g>
      </svg>
      <div class="speedo-readout">
        <strong id="visorSpeed">0</strong>
        <span>km/h</span>
      </div>
    </div>

    <section class="nav-sheet" id="navSheet">
      <p class="nav-waiting">Carregando trajeto até o passageiro…</p>
    </section>
  </div>

  <script src="/js/api.js?v=8"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/utils.js?v=8"></script>
  <script src="/js/maps.js?v=8"></script>
  <script src="/js/trajeto.js?v=8"></script>
</body>
</html>
